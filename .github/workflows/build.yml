name: Build SimbiosaFishing

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract plugin source
        run: |
          unzip -o SimbiosaFishing-GitHub-Upload-Package-v2.zip -d extracted
          cp -a extracted/SimbiosaFishing-GitHub-Package/. .

      - name: Add JitPack repository
        run: sed -i '/repositories {/a\    maven("https://jitpack.io")' build.gradle.kts

      - name: Show Gradle configuration
        run: cat build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimbiosaFishing-JAR
          path: build/libs/*.jar
          if-no-files-found: error
